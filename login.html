<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - StudentHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark-theme');
  }
  </script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="card" style="width: 100%; max-width: 400px;">
    <h2 style="margin-bottom: 1.5rem; text-align: center; color: var(--primary);">Student Portal Login</h2>
    <form id="login-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="form-group">
        <label>Enter Username / Email</label>
        <input type="text" class="form-control" placeholder="username or email" required>
      </div>
      <div class="form-group">
        <label>Enter Password</label>
        <input type="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Login</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
    </p>
  </div>
</body>
</html>
