<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - StudentHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">🎓 StudentHub</div>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="profile.html" class="active">Profile</a></li>
        <li><a href="attendance.html">Attendance</a></li>
        <li><a href="result.html">Semester Result</a></li>
        <li><a href="fees.html">Pay Fees</a></li>
        <li><a href="announcements.html">Announcements</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="login.html">Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <h1>Student Profile</h1>
      
      <div class="card" style="margin-top: 1.5rem;">
        <form id="profile-form">
          <div style="display: flex; align-items: center; gap: 2rem; margin-bottom: 2rem;">
            <img id="avatar-preview" src=" " alt="Profile" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary);">
            <div>
              <label class="btn btn-primary">
                Add Profile Photo
                <input type="file" id="photo-upload" hidden accept="image/*">
              </label>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" id="fname" class="form-control" value="Rahul">
            </div>
            <div class="form-group">
              <label>Middle Name</label>
              <input type="text" id="mname" class="form-control" value="Kumar">
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" id="lname" class="form-control" value="Sharma">
            </div>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" id="email" class="form-control" value="rahul@student.edu">
            </div>
            <div class="form-group">
              <label>Parents Email Address</label>
              <input type="email" id="pemail" class="form-control" value="parent@student.edu">
            </div>
            <div class="form-group">
              <label>Contact No.</label>
              <input type="text" id="contact" class="form-control" value="+91 9876543210">
            </div>
            <div class="form-group">
              <label>Bank Details</label>
              <input type="text" id="bank" class="form-control" value="SBIN0001234 - A/C 9876xxxx">
            </div>
            <div class="form-group">
              <label>Category</label>
              <input type="text" id="category" class="form-control" value="General">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Update Profile Info</button>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Profile Image Preview Mechanism
    document.getElementById('photo-upload').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('avatar-preview').src = reader.result;
      }
      if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });
    if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark-theme');
  }
  </script>
</body>
</html>
