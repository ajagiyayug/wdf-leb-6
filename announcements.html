<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements - StudentHub</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">🎓 StudentHub</div>
      <ul class="nav-links">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="attendance.html">Attendance</a></li>
        <li><a href="result.html">Semester Result</a></li>
        <li><a href="fees.html">Pay Fees</a></li>
        <li><a href="announcements.html" class="active">Announcements</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html">Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <h1>Announcements & Notices</h1>

      <div class="card" style="margin-top: 1.5rem;">
        <h3>Post Notice</h3>
        <form id="notice-form" style="margin-top: 1rem;">
          <div class="form-group">
            <label>Notice Title</label>
            <input type="text" id="notice-title" class="form-control" placeholder="Enter title" required>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="notice-desc" class="form-control" rows="3" placeholder="Enter notice details..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Post Notice</button>
        </form>
      </div>

      <div id="notices-container" style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
        <!-- Dynamic Notices -->
      </div>
    </main>
  </div>
   <script>
    let notices = JSON.parse(localStorage.getItem('notices')) || [
      { id: 1, title: 'Exam Registration', desc: 'Mid-term exam forms are open till Friday.' }
    ];

    function renderNotices() {
      const container = document.getElementById('notices-container');
      container.innerHTML = '';
      notices.forEach((n, idx) => {
        container.innerHTML += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h3>${n.title}</h3>
              <button class="btn btn-danger" style="padding:0.2rem 0.5rem; font-size:0.8rem;" onclick="deleteNotice(${idx})">Delete</button>
            </div>
            <p style="margin-top: 0.5rem; color: var(--text-muted);">${n.desc}</p>
          </div>
        `;
      });
      localStorage.setItem('notices', JSON.stringify(notices));
    }

    document.getElementById('notice-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('notice-title').value;
      const desc = document.getElementById('notice-desc').value;
      notices.unshift({ id: Date.now(), title, desc });
      renderNotices();
      e.target.reset();
    });

    function deleteNotice(idx) {
      notices.splice(idx, 1);
      renderNotices();
    }

    renderNotices();
    if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.classList.add('dark-theme');
  }
  </script>
</body>
</html>
